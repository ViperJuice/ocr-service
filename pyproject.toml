[project]
name = "ocr-service"
version = "0.1.0"
description = "Production-ready OCR service using vision-language models (Qwen3-VL, DeepSeek-OCR)"
requires-python = ">=3.11"
authors = [
    {name = "Jenner", email = "jenner@example.com"},
]
readme = "README.md"
license = {text = "MIT"}
keywords = ["ocr", "vision-language", "document-processing", "deepseek", "qwen"]

dependencies = [
    # Core ML - CRITICAL VERSIONS!
    "torch==2.5.1",
    "transformers>=4.57.0",         # Required for Qwen3-VL support
    "tokenizers>=0.22.0",           # Required by transformers 4.57.0+
    "accelerate>=1.1.0",
    "safetensors>=0.4.0",
    "bitsandbytes>=0.41.0",         # For int8/int4 quantization
    "qwen-vl-utils==0.0.14",        # NEW: Qwen3-VL vision utilities
    # flash-attn>=2.7.3 must be installed separately from source
    
    # Image processing
    "pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "PyMuPDF>=1.23.0",
    "pdf2image>=1.16.0",
    "img2pdf>=0.6.0",
    
    # API
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "python-multipart>=0.0.6",      # File uploads
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    
    # CLI
    "click>=8.1.0",
    "rich>=13.0.0",                 # Beautiful CLI output
    "tqdm>=4.65.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "aiofiles>=23.0.0",             # Async file operations
    "psutil>=5.9.0",                # System monitoring
    "nvidia-ml-py>=12.535.0",       # GPU monitoring (pynvml)

    # Model-specific dependencies
    "einops>=0.7.0",
    "addict>=2.4.0",
    "easydict>=1.13",
    "timm>=1.0.0",
    "sentencepiece>=0.1.99",
    "protobuf>=3.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.24.0",                # For API testing
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
ocr = "src.cli.commands:cli"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

