[project]
name = "ocr-service"
version = "0.1.0"
description = "Production-ready OCR service using vision-language models (Qwen3-VL, DeepSeek-OCR)"
requires-python = ">=3.11"
authors = [
    {name = "Jenner", email = "jenner@example.com"},
]
readme = "README.md"
license = {text = "MIT"}
keywords = ["ocr", "vision-language", "document-processing", "deepseek", "qwen"]

dependencies = [
    # Image/PDF processing
    "pillow>=10.0.0",
    "PyMuPDF>=1.23.0",
    "pdf2image>=1.16.0",
    # API
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "python-multipart>=0.0.6", # File uploads
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.24.0", # HTTP client for container communication
    # CLI
    "click>=8.1.0",
    "rich>=13.0.0", # Beautiful CLI output
    "tqdm>=4.65.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "aiofiles>=23.0.0", # Async file operations
    "psutil>=5.9.0", # System monitoring
    "pynvml>=11.5.0", # NVIDIA GPU monitoring
    # Database
    "supabase>=2.0.0", # Supabase Python client
    "postgrest>=0.10.0", # PostgREST client (dependency of supabase)
    "baml-py==0.213.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
ocr = "src.cli.commands:cli"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "baml_client_py*"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

